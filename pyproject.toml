[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmagent"
dynamic = ["version"]
description = "DarkMatter 3 — durable, sealed agent correspondence over Git"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Losey", email = "daniel@loseylabs.ai" },
]
keywords = ["mcp", "ai", "agents", "git", "darkmatter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "cryptography>=42.0.0",
    "anyio>=4.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
solana = [
    "solana>=0.36.11,<0.41.0",
    "solders>=0.27.1,<0.30.0",
]

[project.scripts]
darkmatter = "darkmatter.cli:main"

[project.urls]
Homepage = "https://github.com/dadukhankevin/DarkMatter"
Repository = "https://github.com/dadukhankevin/DarkMatter"
Issues = "https://github.com/dadukhankevin/DarkMatter/issues"

[tool.hatch.version]
path = "darkmatter/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "darkmatter/",
    "ANTIMATTER.md",
    "README.md",
    "LICENSE",
]
exclude = [
    "archive/",
    "dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["darkmatter"]
